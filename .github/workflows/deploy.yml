# Auto-deploy to the VPS on every push to main.
#
# One-time setup (GitHub → Settings → Secrets and variables → Actions):
#   VPS_HOST      147.93.103.228
#   VPS_USER      the Linux user that owns the app (e.g. root or deploy)
#   VPS_SSH_KEY   private key whose public half is in ~/.ssh/authorized_keys on the VPS
#   VPS_APP_DIR   absolute path of the checkout on the VPS (e.g. /var/www/mywaba)
#   VPS_PORT      (optional) SSH port, default 22
#
# The job only runs when the secrets exist, so the workflow is harmless until you configure it.
name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 30m
          script: |
            set -e
            cd "${{ secrets.VPS_APP_DIR }}"
            bash scripts/deploy.sh
